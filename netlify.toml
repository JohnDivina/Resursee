[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Scheduled function for automated university news aggregation (runs every 6 hours)
[functions."fetch-news"]
  schedule = "0 */6 * * *"
