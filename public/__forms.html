<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netlify Form Discovery for Resursee</title>
</head>
<body>
  <!-- Hidden HTML Form for Netlify Build Bot Form Discovery -->
  <form name="resource-submissions" netlify data-netlify="true" netlify-honeypot="bot-field" method="POST" enctype="multipart/form-data" hidden>
    <input type="hidden" name="form-name" value="resource-submissions" />
    <input type="text" name="bot-field" />
    <input type="text" name="title" />
    <input type="text" name="category" />
    <input type="text" name="department" />
    <input type="text" name="documentType" />
    <input type="text" name="versionLabel" />
    <input type="text" name="sourceName" />
    <input type="url" name="sourceUrl" />
    <input type="text" name="submitterName" />
    <input type="email" name="submitterEmail" />
    <input type="text" name="submitterRole" />
    <textarea name="description"></textarea>
    <textarea name="submissionNotes"></textarea>
    <input type="file" name="attachment" />
  </form>
</body>
</html>
